name: Archive KOGAS pipeline pressures

on:
  schedule:
    # Singapore time: 07:07, 12:07, 17:07, 22:07 (UTC+8)
    # Seven minutes after the hour avoids GitHub's busiest cron minute.
    - cron: '7 23 * * *'  # 07:07 SGT (next calendar day)
    - cron: '7 4 * * *'   # 12:07 SGT
    - cron: '7 9 * * *'   # 17:07 SGT
    - cron: '7 14 * * *'  # 22:07 SGT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kogas-pressure-csv
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine Singapore collection slot
        id: slot
        shell: bash
        env:
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          case "$CRON_EXPRESSION" in
            '7 23 * * *') echo 'value=07:00' >> "$GITHUB_OUTPUT" ;;
            '7 4 * * *')  echo 'value=12:00' >> "$GITHUB_OUTPUT" ;;
            '7 9 * * *')  echo 'value=17:00' >> "$GITHUB_OUTPUT" ;;
            '7 14 * * *') echo 'value=22:00' >> "$GITHUB_OUTPUT" ;;
            *) echo 'value=manual' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Scrape station pressures
        run: python scrape_kogas.py --slot '${{ steps.slot.outputs.value }}'

      - name: Commit updated CSV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kogas_pressures.csv
          if git diff --cached --quiet; then
            echo 'No CSV changes to commit.'
            exit 0
          fi
          git commit -m 'Update KOGAS pressures (${{ steps.slot.outputs.value }} SGT)'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
