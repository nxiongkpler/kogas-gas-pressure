
name: Archive KOGAS pipeline pressures

on:
  schedule:
    # Singapore: 07:00, 12:00, 17:00, 22:00
    # UTC:       23:00, 04:00, 09:00, 14:00
    - cron: '0 23,4,9,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kogas-pressure
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape KOGAS pressure
        run: python scrape_kogas.py

      - name: Commit CSV updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update KOGAS pressure data"
            git push
          fi
